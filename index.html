<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบยืม-คืนครุภัณฑ์ โรงพยาบาลสัตว์ มอ.</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f0efe9;color:#1a1a18;font-size:15px}
.app{max-width:960px;margin:0 auto;padding:1.5rem 1rem 3rem}
.header{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:1rem}
.logo{width:52px;height:52px;border-radius:50%;background:#185FA5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo i{color:#fff;font-size:24px}
.header-info{flex:1}
.header-title{font-size:15px;font-weight:600;line-height:1.4}
.header-sub{font-size:12px;color:#5f5e5a;margin-top:3px}
.status-bar{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:8px;padding:8px 16px;margin-bottom:1.25rem;display:flex;align-items:center;gap:10px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:#3B6D11;animation:pulse 2s infinite}
.dot-yellow{background:#BA7517}
.dot-red{background:#A32D2D}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.tab{padding:9px 18px;border:0.5px solid rgba(0,0,0,.15);border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#5f5e5a;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s}
.tab.active{background:#E6F1FB;border-color:#378ADD;color:#0C447C;font-weight:500}
.badge{background:#378ADD;color:#fff;border-radius:20px;padding:1px 7px;font-size:11px}
.card{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.section-title{font-size:13px;font-weight:500;color:#5f5e5a;border-bottom:0.5px solid rgba(0,0,0,.1);padding-bottom:10px;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:#5f5e5a;font-weight:500}
.field input,.field select,.field textarea{font-size:13px;padding:8px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:#1a1a18;width:100%;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,.15)}
.field input[readonly]{background:#f7f7f5;color:#5f5e5a}
.field textarea{resize:vertical;min-height:70px}
.req{color:#E24B4A}
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;max-height:220px;overflow-y:auto;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.13);margin-top:2px}
.ac-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:0.5px solid rgba(0,0,0,.06)}
.ac-item:hover{background:#E6F1FB}
.ac-item:last-child{border-bottom:none}
.eq-row{border:0.5px solid rgba(0,0,0,.1);border-radius:8px;padding:14px;margin-bottom:10px;background:#f7f7f5}
.eq-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.eq-label{font-size:12px;font-weight:500;color:#185FA5}
.btn-remove{background:none;border:none;cursor:pointer;color:#888;font-size:18px;display:flex;align-items:center}
.btn-remove:hover{color:#E24B4A}
.btn-add{display:flex;align-items:center;gap:8px;padding:9px 14px;border:0.5px dashed rgba(0,0,0,.2);border-radius:8px;font-size:13px;cursor:pointer;background:transparent;color:#5f5e5a;width:100%;justify-content:center;margin-bottom:1rem;font-family:inherit}
.btn-add:hover{background:#f0efe9}
.info-box{background:#EAF3DE;border:0.5px solid #97C459;border-radius:8px;padding:10px 14px;font-size:12px;color:#27500A;margin-top:6px;display:flex;gap:8px;align-items:flex-start}
.warn-box{background:#FAEEDA;border:0.5px solid #EF9F27;border-radius:8px;padding:10px 14px;font-size:12px;color:#633806;margin-top:6px;display:flex;gap:8px}
.btn-primary{background:#185FA5;color:#fff;border:none;padding:11px 28px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit}
.btn-primary:hover{background:#0C447C}
.btn-primary:disabled{background:#aaa;cursor:not-allowed}
.btn-success{background:#3B6D11;color:#fff;border:none;padding:9px 22px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-danger{background:transparent;color:#791F1F;border:0.5px solid #F09595;padding:9px 22px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-warn{background:#BA7517;color:#fff;border:none;padding:9px 22px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.sbadge{padding:3px 12px;border-radius:20px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.s-pending{background:#FAEEDA;color:#633806}
.s-approved{background:#EAF3DE;color:#27500A}
.s-rejected{background:#FCEBEB;color:#791F1F}
.s-ack{background:#E6F1FB;color:#0C447C}
.s-unavail{background:#f0efe9;color:#5f5e5a}
.s-borrowed{background:#EEEDFE;color:#26215C}
.s-returned{background:#E1F5EE;color:#04342C}
.s-done{background:#EAF3DE;color:#27500A}
.req-card{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1.25rem;cursor:pointer;transition:border-color .15s;margin-bottom:10px}
.req-card:hover{border-color:rgba(0,0,0,.28)}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.req-name{font-size:14px;font-weight:500}
.req-meta{font-size:12px;color:#5f5e5a;margin-top:3px}
.req-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:0.5px solid rgba(0,0,0,.08);font-size:11px;color:#888;flex-wrap:wrap;gap:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:720px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:0.5px solid rgba(0,0,0,.1)}
.modal-title{font-size:15px;font-weight:600}
.btn-close{background:none;border:none;cursor:pointer;font-size:22px;color:#5f5e5a;display:flex;align-items:center}
.ig{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:13px;margin-bottom:8px}
.il{color:#5f5e5a;font-size:12px;padding-top:2px}
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:10px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:13px;top:30px;bottom:0;width:0.5px;background:rgba(0,0,0,.12)}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.td-done{background:#C0DD97;color:#27500A}
.td-cur{background:#B5D4F4;color:#0C447C}
.td-wait{background:#f0efe9;color:#888}
.td-bad{background:#F7C1C1;color:#791F1F}
.tl-body{flex:1;padding-top:4px}
.tl-t{font-size:13px;font-weight:500}
.tl-s{font-size:11px;color:#5f5e5a;margin-top:2px}
.divider{height:0.5px;background:rgba(0,0,0,.1);margin:1rem 0}
.empty{text-align:center;padding:3.5rem 1rem;color:#5f5e5a}
.empty i{font-size:48px;margin-bottom:16px;display:block;color:rgba(0,0,0,.15)}
.success-banner{background:#EAF3DE;border:0.5px solid #97C459;border-radius:8px;padding:12px 16px;display:flex;gap:10px;margin-bottom:1rem}
.action-row{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap;align-items:center}
.step-label{font-size:11px;font-weight:600;color:#5f5e5a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.eq-info-card{background:#f7f7f5;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:8px}
.eq-info-name{font-weight:500;color:#0C447C;margin-bottom:4px}
.cond-sel{font-size:13px;padding:7px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:6px;font-family:inherit;background:#fff;margin-top:4px;width:100%}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:12px}
.spinner{width:40px;height:40px;border:3px solid rgba(24,95,165,.2);border-top-color:#185FA5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:400;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast-ok{background:#3B6D11}
.toast-err{background:#A32D2D}
.setup-card{background:#fff;border:2px dashed #378ADD;border-radius:12px;padding:2rem;text-align:center;margin-bottom:1rem}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.ig{grid-template-columns:1fr}.tabs{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app" id="root"></div>
<div id="loading-overlay" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div id="loading-text" style="font-size:13px;color:#5f5e5a">กำลังโหลด...</div>
</div>
<div id="toast" class="toast" style="display:none"></div>

// ======= HELPERS =======
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(d){ if(!d||d==='-') return '-'; const p=String(d).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; }
function fmtDT(d,t){ return fmtDate(d)+(t?' '+t:''); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function searchEquip(q){ if(!q) return []; const lq=q.toLowerCase(); return PSU_EQUIPMENT.filter(e=>e.name.toLowerCase().includes(lq)||e.code.toLowerCase().includes(lq)).slice(0,12); }
function searchStaff(q){ if(!q) return []; const lq=q.toLowerCase(); return PSU_STAFF.filter(s=>s.name.toLowerCase().includes(lq)).slice(0,8); }

function showToast(msg,type,dur){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+(type==='ok'?'toast-ok':type==='err'?'toast-err':'');

  window._toastTimer=setTimeout(()=>t.style.display='none',dur||3000);
}

// ======= API CALLS via JSONP (no CORS issue) =======
function gasCall(action, data){
  return new Promise((resolve, reject) => {
    if(!GAS_URL){ reject(new Error('ยังไม่ได้ตั้งค่า GAS URL')); return; }
    const cbName = '_cb_'+Date.now();
    const script = document.createElement('script');
    let done = false;
    window[cbName] = function(result){
      done = true;
      delete window[cbName];
      document.body.removeChild(script);
      if(result && result.error) reject(new Error(result.error));
      else resolve(result);
    };
    const timer = setTimeout(()=>{
      if(!done){ delete window[cbName]; try{document.body.removeChild(script);}catch(e){}
        reject(new Error('Request timeout')); }
    }, 15000);
    if(data){
      // POST via hidden form + iframe trick for JSONP
      fetch(GAS_URL+'?action='+action+'&callback='+cbName, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data),
        mode:'no-cors'
      }).catch(()=>{});
      // Fallback: GET with data encoded
      const encoded = encodeURIComponent(JSON.stringify(data));
      script.src = GAS_URL+'?action='+action+'&data='+encoded+'&callback='+cbName;
    } else {
      script.src = GAS_URL+'?action='+action+'&callback='+cbName;
    }
    document.body.appendChild(script);
  });
}

// Proper fetch-based API (uses fetch with mode cors — requires GAS to set CORS headers)
async function apiCall(action, body){
  if(!GAS_URL) throw new Error('ยังไม่ได้ตั้งค่า GAS URL — คลิกปุ่มตั้งค่า');
  const url = GAS_URL + '?action=' + action;
  const opts = body
    ? { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) }
    : { method:'GET' };
  const res = await fetch(url, opts);
  const json = await res.json();
  if(json && json.error) throw new Error(json.error);
  return json;
}

// ======= LOAD ALL REQUESTS =======
async function loadRequests(){
  if(!GAS_URL){ state.requests=[]; render(); return; }
  state.syncing=true; render();
  try {
    const data = await apiCall('getAll');
    state.requests = Array.isArray(data) ? data.map(r => ({
      ...r,
      form: {
        name: r.requesterName, position: r.requesterPosition,
        dept: r.requesterDept, email: r.requesterEmail,
        purpose: r.purpose, borrowFrom: r.borrowFrom,
        bFromTime: r.borrowFromTime, borrowTo: r.borrowTo,
        bToTime: r.borrowToTime, date: r.createdAt?.split('T')[0]||'',
        equipment: r.equipmentJSON||[]
      }
    })) : [];
    state.lastSync = new Date();
    showToast('โหลดข้อมูลสำเร็จ ('+state.requests.length+' รายการ)','ok',2000);
  } catch(e) {
    showToast('โหลดข้อมูลล้มเหลว: '+e.message,'err',4000);
  }
  state.syncing=false; render();
}

window.saveGasUrl = async function(){
  const url = document.getElementById('gas-url-input')?.value?.trim();
  if(!url){ showToast('กรุณาใส่ URL','err'); return; }
  showLoading('กำลังทดสอบการเชื่อมต่อ...');
  GAS_URL = url;
  try {
    await apiCall('ping');
    localStorage.setItem('psu_gas_url',url);
    showToast('เชื่อมต่อสำเร็จ!','ok');
    hideLoading();
    await loadRequests();
  } catch(e) {
    hideLoading();
    showToast('เชื่อมต่อล้มเหลว: '+e.message,'err',5000);
    GAS_URL='';
  }
};

window.changeUrl = function(){
  GAS_URL=''; localStorage.removeItem('psu_gas_url'); state.requests=[]; render();
};

// ======= TIMELINE =======
function tlItem(label,sub,done,cur,bad){
  const cls=bad?'td-bad':done?'td-done':cur?'td-cur':'td-wait';
  const icon=bad?'ti-x':done?'ti-check':cur?'ti-loader-2':'ti-clock';
  return `<div class="tl-item"><div class="tl-dot ${cls}"><i class="ti ${icon}" style="font-size:13px" aria-hidden="true"></i></div>
    <div class="tl-body"><div class="tl-t" style="color:${bad?'#791F1F':'inherit'}">${label}</div><div class="tl-s">${sub}</div></div></div>`;
}

    </div>
    <div class="divider"></div>
    <div style="font-size:12px;font-weight:500;color:#5f5e5a;margin-bottom:8px">รายการครุภัณฑ์</div>
    ${eqCards}
    <div class="divider"></div>
    <div class="ig">
      <span class="il">ยืมตั้งแต่</span><span>${fmtDT(r.form.borrowFrom,r.form.bFromTime)}</span>
      <span class="il">ถึงวันที่</span><span>${fmtDT(r.form.borrowTo,r.form.bToTime)}</span>
    </div>
    <div class="divider"></div>
    <div style="font-size:12px;font-weight:500;color:#5f5e5a;margin-bottom:10px">ขั้นตอนการดำเนินการ</div>
    <div class="tl">${steps}</div>
    ${actions}`;
}

// ======= ACTIONS =======
window.doAction = async function(id, newStatus){
  const r=state.requests.find(x=>x.id===id);
  if(!r) return;
  showLoading('กำลังอัปเดตสถานะ...');
  try {
    await apiCall('updateStatus',{id, status:newStatus, equipment:r.form.equipment});
    showToast('อัปเดตสถานะเรียบร้อย: '+newStatus,'ok');
    await loadRequests();
    state.selectedId=null;
  } catch(e){ showToast('เกิดข้อผิดพลาด: '+e.message,'err',5000); }
  hideLoading(); render();
};

window.doAcknowledge = async function(id, ok){
  const r=state.requests.find(x=>x.id===id);
  if(!r) return;
  const eqs=[...r.form.equipment];
  if(ok){
    let allFilled=true;
    eqs.forEach(eq=>{
      const el=document.getElementById('cond-'+eq.id);
      if(el&&el.value) eq.condBefore=el.value; else allFilled=false;
    });
    if(!allFilled){ showToast('กรุณาเลือกสภาพครุภัณฑ์ก่อนยืมให้ครบทุกรายการ','err'); return; }
  }
  showLoading('กำลังบันทึก...');
  try {
    await apiCall('updateStatus',{id, status: ok?'รับทราบแล้ว':'ไม่สามารถให้ยืมได้', equipment: eqs});
    showToast(ok?'รับทราบแล้ว — บันทึกสภาพครุภัณฑ์เรียบร้อย':'บันทึก: ไม่สามารถให้ยืมได้','ok');
    await loadRequests();
    state.selectedId=null;
  } catch(e){ showToast('เกิดข้อผิดพลาด: '+e.message,'err',5000); }
  hideLoading(); render();
};

window.doInspect = async function(id){
  const r=state.requests.find(x=>x.id===id);
  if(!r) return;
  const eqs=[...r.form.equipment];
  let allFilled=true;
  eqs.forEach(eq=>{
    const el=document.getElementById('after-'+eq.id);
    if(el&&el.value) eq.condAfter=el.value; else allFilled=false;
  });
  if(!allFilled){ showToast('กรุณาเลือกสภาพครุภัณฑ์หลังใช้งานให้ครบทุกรายการ','err'); return; }
  showLoading('กำลังบันทึกและปิดคำขอ...');
  try {
    await apiCall('updateStatus',{id, status:'ตรวจสภาพเสร็จสิ้น', equipment: eqs});
    showToast('ปิดคำขอเรียบร้อย — บันทึกสภาพครุภัณฑ์หลังใช้งานแล้ว','ok');
    await loadRequests();
    state.selectedId=null;
  } catch(e){ showToast('เกิดข้อผิดพลาด: '+e.message,'err',5000); }
  hideLoading(); render();
};

// ======= SUBMIT =======
window.submitForm = async function(){
  const f=state.form;
  if(!f.name||!f.position||!f.dept||!f.email||!f.purpose||!f.borrowFrom||!f.borrowTo){
    showToast('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน','err'); return;
  }
  if(f.equipment.some(e=>!e.name||!e.code)){
    showToast('กรุณาเลือกครุภัณฑ์ให้ครบทุกรายการ','err'); return;
  }
  const btn=document.getElementById('submit-btn');
  if(btn) btn.disabled=true;
  showLoading('กำลังบันทึกใน Google Sheets และส่งอีเมล...');
  try {
    const result = await apiCall('create', {
      name:f.name, position:f.position, dept:f.dept, email:f.email,
      purpose:f.purpose, date:f.date,
      borrowFrom:f.borrowFrom, borrowFromTime:f.bFromTime,
      borrowTo:f.borrowTo, borrowToTime:f.bToTime,
      equipment:f.equipment
    });
    showToast('บันทึกสำเร็จ! เลขที่: '+result.id,'ok',4000);
    state.submitted=true;
    state.form={date:today(),name:'',position:'',dept:'',email:'',purpose:'',borrowFrom:'',bFromTime:'',borrowTo:'',bToTime:'',equipment:[{id:1,code:'',name:'',location:'',responsible:'',responsibleEmail:'',condBefore:'',condAfter:''}]};
    state.eqCnt=2;
    await loadRequests();
  } catch(e) {
    showToast('บันทึกไม่สำเร็จ: '+e.message,'err',6000);
    if(btn) btn.disabled=false;
  }
  hideLoading(); render();
};

// ======= AUTOCOMPLETE =======
window.eqSearch=function(eqId,q){
  const eq=state.form.equipment.find(e=>e.id===eqId);
  if(eq){eq.name=q;eq.code='';eq.location='';eq.responsible='';eq.responsibleEmail='';}
  const items=searchEquip(q);
  const drop=document.getElementById('eqdrop-'+eqId);
  if(!drop) return;
  if(!q||!items.length){drop.style.display='none';return;}
  drop.innerHTML=items.map(e=>`<div class="ac-item" onmousedown="selectEq(${eqId},${JSON.stringify(e).replace(/"/g,'&quot;')})">
    <strong>${esc(e.name.length>45?e.name.slice(0,45)+'…':e.name)}</strong>
    <div style="font-size:11px;color:#5f5e5a">${esc(e.code)} · ${esc(e.responsible)}</div>
  </div>`).join('');
  drop.style.display='block';
};
window.selectEq=function(eqId,e){
  const eq=state.form.equipment.find(x=>x.id===eqId);
  if(!eq) return;
  Object.assign(eq,{code:e.code,name:e.name,location:e.location,responsible:e.responsible,responsibleEmail:e.responsibleEmail||''});
  const inp=document.getElementById('eq-name-'+eqId);
  if(inp) inp.value=e.name;
  document.getElementById('eqdrop-'+eqId).style.display='none';
  render();
};
window.closeAc=function(id,d){setTimeout(()=>{const el=document.getElementById('eqdrop-'+id);if(el)el.style.display='none';},d);};
window.staffSearch=function(q){
  state.form.name=q;
  const items=searchStaff(q);
  const drop=document.getElementById('staff-drop');
  if(!drop) return;
  if(!q||!items.length){drop.style.display='none';return;}
  drop.innerHTML=items.map(s=>`<div class="ac-item" onmousedown="selectStaff(${JSON.stringify(s).replace(/"/g,'&quot;')})">
    <strong>${esc(s.name)}</strong>
    <div style="font-size:11px;color:#5f5e5a">${esc(s.position)} · ${esc(s.dept)}</div>
  </div>`).join('');
  drop.style.display='block';
};
window.selectStaff=function(s){
  Object.assign(state.form,{name:s.name,position:s.position,dept:s.dept,email:s.email});
  document.getElementById('staff-drop').style.display='none';
  render();
};
window.closeStaffAc=function(d){setTimeout(()=>{const el=document.getElementById('staff-drop');if(el)el.style.display='none';},d);};

// ======= NAV =======
window.setTab=async t=>{
  state.tab=t; state.submitted=false; render();
  if(t==='list') await loadRequests();
};
window.updF=(k,v)=>{state.form[k]=v;};
window.addEq=()=>{state.form.equipment.push({id:state.eqCnt++,code:'',name:'',location:'',responsible:'',responsibleEmail:'',condBefore:'',condAfter:''});render();};
window.removeEq=id=>{if(state.form.equipment.length<=1)return;state.form.equipment=state.form.equipment.filter(e=>e.id!==id);render();};
window.openDetail=id=>{state.selectedId=id;render();};
window.closeDetail=()=>{state.selectedId=null;render();};

// ======= MAIN RENDER =======
function render(){
  const root=document.getElementById('root');
  const req=state.requests.find(r=>r.id===state.selectedId);
  const isConnected=!!GAS_URL;
  const connBadge=isConnected
    ?`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#EAF3DE;color:#27500A;border-radius:4px;padding:2px 8px;cursor:pointer" title="kittiyaso-star.github.io"><span class="dot dot-green"></span>เชื่อมต่อ Google Sheets · kittiya.so@psu.ac.th</span>`
    :`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#FCEBEB;color:#791F1F;border-radius:4px;padding:2px 8px"><span class="dot dot-red"></span>ยังไม่ได้เชื่อมต่อ</span>`;

  root.innerHTML=`
    <div class="header">
      <div class="logo"><i class="ti ti-building-hospital" aria-hidden="true"></i></div>
      <div class="header-info">
        <div class="header-title">ระบบยืม-คืนครุภัณฑ์ โรงพยาบาลสัตว์ มหาวิทยาลัยสงขลานครินทร์</div>
        <div class="header-sub">คณะสัตวแพทยศาสตร์ · kittiya.so@psu.ac.th</div>
        <div style="margin-top:6px">${connBadge}</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${state.tab==='form'?'active':''}" onclick="setTab('form')">
        <i class="ti ti-clipboard-plus" aria-hidden="true"></i> ยืมครุภัณฑ์
      </button>
      <button class="tab ${state.tab==='list'?'active':''}" onclick="setTab('list')">
        <i class="ti ti-list-check" aria-hidden="true"></i> ติดตามสถานะ
        ${state.requests.length>0?`<span class="badge">${state.requests.length}</span>`:''}
      </button>
    </div>
    <div id="main-content">${state.tab==='form'?renderForm():renderList()}</div>
    ${req?`<div class="modal-bg" onclick="closeDetail()" role="dialog" aria-modal="true">
      <div class="modal" onclick="event.stopPropagation()">${renderDetail(req)}</div>
    </div>`:''}
  `;
}

// ======= INIT =======
render();
if(GAS_URL){ loadRequests(); }
</script>
</body>
</html>
