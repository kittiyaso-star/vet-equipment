<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบประเมินทดลองงาน - สร้างรายการประเมิน</title>
<style>
  :root {
    --primary: #0f6e56;
    --primary-dark: #085041;
    --border: #d9d9d3;
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #2c2c2a;
    --text-muted: #6b6a64;
    --danger: #a32d2d;
    --warn: #854f0b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Sarabun", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 14px; }
  nav { margin-top: 12px; }
  nav a {
    display: inline-block;
    margin-right: 10px;
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
  }
  nav a.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  .formtype-row { display: flex; gap: 10px; }
  .formtype-row label.pick {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
  }
  .formtype-row input[type=radio] { width: auto; }
  .formtype-row label.pick:has(input:checked) { border-color: var(--primary); background: #e1f5ee; }
  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .result {
    display: none;
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    background: #e1f5ee;
    border: 1px solid #9fe1cb;
  }
  .result.show { display: block; }
  .link-row { display: flex; gap: 8px; margin-top: 8px; }
  .link-row input { flex: 1; font-size: 13px; background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 500; }
  .badge { padding: 2px 10px; border-radius: 20px; font-size: 12px; }
  .badge.pending { background: #faeeda; color: var(--warn); }
  .badge.done { background: #eaf3de; color: #27500a; }
  .empty { color: var(--text-muted); font-size: 14px; padding: 20px 0; text-align: center; }
  .row-actions button { padding: 6px 10px; font-size: 12px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ระบบประเมินทดลองงาน</h1>
    <div class="sub">โรงพยาบาลสัตว์ มหาวิทยาลัยสงขลานครินทร์ — หน้าผู้ดูแลระบบ</div>
    <nav>
      <a href="index.html" class="active">สร้างรายการประเมิน</a>
      <a href="dashboard.html">แดชบอร์ดสรุปผล</a>
    </nav>
  </header>

  <div class="card">
    <h2>สร้างรายการประเมินใหม่</h2>
    <form id="createForm">
      <div class="grid">
        <div class="full">
          <label>ชื่อผู้รับการประเมิน</label>
          <input type="text" id="evaluateeName" required placeholder="เช่น นายณัฐนันท์ บุญมี">
        </div>
        <div>
          <label>ตำแหน่ง</label>
          <input type="text" id="position" required placeholder="เช่น ผู้ช่วยสัตวแพทย์">
        </div>
        <div>
          <label>หน่วยงาน</label>
          <input type="text" id="department" value="โรงพยาบาลสัตว์ มหาวิทยาลัยสงขลานครินทร์">
        </div>
        <div>
          <label>วันที่จ้าง</label>
          <input type="date" id="hireDate" required>
        </div>
        <div>
          <label>ช่วงเวลาประเมิน</label>
          <select id="periodMonths">
            <option value="3">3 เดือน</option>
            <option value="6">6 เดือน</option>
            <option value="9">9 เดือน</option>
          </select>
        </div>
        <div class="full">
          <label>รอบการประเมิน</label>
          <select id="round">
            <option value="1">ครั้งที่ 1</option>
            <option value="2">ครั้งที่ 2</option>
            <option value="3">ครั้งที่ 3</option>
          </select>
        </div>
        <div class="full">
          <label>ประเภทแบบฟอร์ม</label>
          <div class="formtype-row">
            <label class="pick"><input type="radio" name="formType" value="vet" checked> นายสัตวแพทย์ (30 + 70 คะแนน)</label>
            <label class="pick"><input type="radio" name="formType" value="staff"> บุคลากรทั่วไป (40 + 60 คะแนน)</label>
          </div>
        </div>
      </div>
      <div style="margin-top:18px;">
        <button type="submit">สร้างลิงก์ประเมิน</button>
      </div>
    </form>
    <div class="result" id="result">
      <div>สร้างรายการเรียบร้อย — ส่งลิงก์นี้ให้ผู้ประเมินกรอกแบบฟอร์ม</div>
      <div class="link-row">
        <input type="text" id="linkOutput" readonly>
        <button type="button" class="secondary" onclick="copyLink()">คัดลอกลิงก์</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>รายการที่สร้างไว้</h2>
    <div id="listArea"><div class="empty">กำลังโหลด...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// TODO: แก้เป็น URL ของ Web App ที่ deploy จาก Code.gs
const API_URL = 'https://script.google.com/macros/s/AKfycbz8HWROtIx9FoR01h0XH_NvYnQr4R7OyHrSaTXplChtX896YAOC6wBRxZ6rWupLPaNj/exec';
const EVAL_PAGE = 'eval.html';

async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'เกิดข้อผิดพลาด');
  return json.data;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
  try {
    const payload = {
      evaluateeName: document.getElementById('evaluateeName').value.trim(),
      position: document.getElementById('position').value.trim(),
      department: document.getElementById('department').value.trim(),
      hireDate: document.getElementById('hireDate').value,
      periodMonths: document.getElementById('periodMonths').value,
      round: document.getElementById('round').value,
      formType: document.querySelector('input[name=formType]:checked').value
    };
    const data = await api('createRequest', payload);
    const link = `${location.origin}${location.pathname.replace('index.html','')}${EVAL_PAGE}?id=${data.id}`;
    document.getElementById('linkOutput').value = link;
    document.getElementById('result').classList.add('show');
    e.target.reset();
    document.getElementById('department').value = 'โรงพยาบาลสัตว์ มหาวิทยาลัยสงขลานครินทร์';
    loadList();
  } catch (err) {
    alert('สร้างรายการไม่สำเร็จ: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'สร้างลิงก์ประเมิน';
  }
});

function copyLink() {
  const input = document.getElementById('linkOutput');
  input.select();
  navigator.clipboard.writeText(input.value).then(() => showToast('คัดลอกลิงก์แล้ว'));
}

function copyLinkFor(id) {
  const link = `${location.origin}${location.pathname.replace('index.html','')}${EVAL_PAGE}?id=${id}`;
  navigator.clipboard.writeText(link).then(() => showToast('คัดลอกลิงก์แล้ว'));
}

async function loadList() {
  const area = document.getElementById('listArea');
  try {
    const rows = await api('listRequests', {});
    if (!rows.length) {
      area.innerHTML = '<div class="empty">ยังไม่มีรายการประเมิน</div>';
      return;
    }
    const formTypeLabel = { vet: 'สัตวแพทย์', staff: 'บุคลากรทั่วไป' };
    area.innerHTML = `<table>
      <thead><tr>
        <th>ชื่อ</th><th>ตำแหน่ง</th><th>ประเภท</th><th>รอบ</th><th>สถานะ</th><th></th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${escapeHtml(r.evaluateeName)}</td>
            <td>${escapeHtml(r.position)}</td>
            <td>${formTypeLabel[r.formType] || r.formType}</td>
            <td>ครั้งที่ ${r.round} (${r.periodMonths} ด.)</td>
            <td><span class="badge ${r.status}">${r.status === 'done' ? 'ประเมินแล้ว' : 'รอผู้ประเมิน'}</span></td>
            <td class="row-actions">
              <button type="button" class="secondary" onclick="copyLinkFor('${r.id}')">คัดลอกลิงก์</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  } catch (err) {
    area.innerHTML = `<div class="empty">โหลดรายการไม่สำเร็จ: ${escapeHtml(err.message)}</div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadList();
</script>
</body>
</html>
