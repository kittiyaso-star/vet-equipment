<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบยืม-คืนครุภัณฑ์ โรงพยาบาลสัตว์ มอ.</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f0efe9;color:#1a1a18;font-size:15px}
.app{max-width:960px;margin:0 auto;padding:1.5rem 1rem 3rem}
.header{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:1rem}
.logo{width:52px;height:52px;border-radius:50%;background:#185FA5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo i{color:#fff;font-size:24px}
.header-info{flex:1}
.header-title{font-size:15px;font-weight:600;line-height:1.4}
.header-sub{font-size:12px;color:#5f5e5a;margin-top:3px}
.status-bar{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:8px;padding:8px 16px;margin-bottom:1.25rem;display:flex;align-items:center;gap:10px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:#3B6D11;animation:pulse 2s infinite}
.dot-yellow{background:#BA7517}
.dot-red{background:#A32D2D}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.tab{padding:9px 18px;border:0.5px solid rgba(0,0,0,.15);border-radius:8px;font-size:13px;cursor:pointer;background:#fff;color:#5f5e5a;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s}
.tab.active{background:#E6F1FB;border-color:#378ADD;color:#0C447C;font-weight:500}
.badge{background:#378ADD;color:#fff;border-radius:20px;padding:1px 7px;font-size:11px}
.card{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.section-title{font-size:13px;font-weight:500;color:#5f5e5a;border-bottom:0.5px solid rgba(0,0,0,.1);padding-bottom:10px;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:#5f5e5a;font-weight:500}
.field input,.field select,.field textarea{font-size:13px;padding:8px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;background:#fff;color:#1a1a18;width:100%;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,.15)}
.field input[readonly]{background:#f7f7f5;color:#5f5e5a}
.field textarea{resize:vertical;min-height:70px}
.req{color:#E24B4A}
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;max-height:220px;overflow-y:auto;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.13);margin-top:2px}
.ac-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:0.5px solid rgba(0,0,0,.06)}
.ac-item:hover{background:#E6F1FB}
.ac-item:last-child{border-bottom:none}
.eq-row{border:0.5px solid rgba(0,0,0,.1);border-radius:8px;padding:14px;margin-bottom:10px;background:#f7f7f5}
.eq-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.eq-label{font-size:12px;font-weight:500;color:#185FA5}
.btn-remove{background:none;border:none;cursor:pointer;color:#888;font-size:18px;display:flex;align-items:center}
.btn-remove:hover{color:#E24B4A}
.btn-add{display:flex;align-items:center;gap:8px;padding:9px 14px;border:0.5px dashed rgba(0,0,0,.2);border-radius:8px;font-size:13px;cursor:pointer;background:transparent;color:#5f5e5a;width:100%;justify-content:center;margin-bottom:1rem;font-family:inherit}
.btn-add:hover{background:#f0efe9}
.info-box{background:#EAF3DE;border:0.5px solid #97C459;border-radius:8px;padding:10px 14px;font-size:12px;color:#27500A;margin-top:6px;display:flex;gap:8px;align-items:flex-start}
.warn-box{background:#FAEEDA;border:0.5px solid #EF9F27;border-radius:8px;padding:10px 14px;font-size:12px;color:#633806;margin-top:6px;display:flex;gap:8px}
.btn-primary{background:#185FA5;color:#fff;border:none;padding:11px 28px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit}
.btn-primary:hover{background:#0C447C}
.btn-primary:disabled{background:#aaa;cursor:not-allowed}
.btn-success{background:#3B6D11;color:#fff;border:none;padding:9px 22px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-danger{background:transparent;color:#791F1F;border:0.5px solid #F09595;padding:9px 22px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn-warn{background:#BA7517;color:#fff;border:none;padding:9px 22px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.sbadge{padding:3px 12px;border-radius:20px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.s-pending{background:#FAEEDA;color:#633806}
.s-approved{background:#EAF3DE;color:#27500A}
.s-rejected{background:#FCEBEB;color:#791F1F}
.s-ack{background:#E6F1FB;color:#0C447C}
.s-unavail{background:#f0efe9;color:#5f5e5a}
.s-borrowed{background:#EEEDFE;color:#26215C}
.s-returned{background:#E1F5EE;color:#04342C}
.s-done{background:#EAF3DE;color:#27500A}
.req-card{background:#fff;border:0.5px solid rgba(0,0,0,.12);border-radius:12px;padding:1.25rem;cursor:pointer;transition:border-color .15s;margin-bottom:10px}
.req-card:hover{border-color:rgba(0,0,0,.28)}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.req-name{font-size:14px;font-weight:500}
.req-meta{font-size:12px;color:#5f5e5a;margin-top:3px}
.req-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:0.5px solid rgba(0,0,0,.08);font-size:11px;color:#888;flex-wrap:wrap;gap:4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem}
.modal{background:#fff;border-radius:12px;padding:1.5rem;width:100%;max-width:720px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:0.5px solid rgba(0,0,0,.1)}
.modal-title{font-size:15px;font-weight:600}
.btn-close{background:none;border:none;cursor:pointer;font-size:22px;color:#5f5e5a;display:flex;align-items:center}
.ig{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:13px;margin-bottom:8px}
.il{color:#5f5e5a;font-size:12px;padding-top:2px}
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:10px;padding-bottom:14px;position:relative}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:13px;top:30px;bottom:0;width:0.5px;background:rgba(0,0,0,.12)}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.td-done{background:#C0DD97;color:#27500A}
.td-cur{background:#B5D4F4;color:#0C447C}
.td-wait{background:#f0efe9;color:#888}
.td-bad{background:#F7C1C1;color:#791F1F}
.tl-body{flex:1;padding-top:4px}
.tl-t{font-size:13px;font-weight:500}
.tl-s{font-size:11px;color:#5f5e5a;margin-top:2px}
.divider{height:0.5px;background:rgba(0,0,0,.1);margin:1rem 0}
.empty{text-align:center;padding:3.5rem 1rem;color:#5f5e5a}
.empty i{font-size:48px;margin-bottom:16px;display:block;color:rgba(0,0,0,.15)}
.success-banner{background:#EAF3DE;border:0.5px solid #97C459;border-radius:8px;padding:12px 16px;display:flex;gap:10px;margin-bottom:1rem}
.action-row{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap;align-items:center}
.step-label{font-size:11px;font-weight:600;color:#5f5e5a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.eq-info-card{background:#f7f7f5;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:8px}
.eq-info-name{font-weight:500;color:#0C447C;margin-bottom:4px}
.cond-sel{font-size:13px;padding:7px 10px;border:0.5px solid rgba(0,0,0,.2);border-radius:6px;font-family:inherit;background:#fff;margin-top:4px;width:100%}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:12px}
.spinner{width:40px;height:40px;border:3px solid rgba(24,95,165,.2);border-top-color:#185FA5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:400;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast-ok{background:#3B6D11}
.toast-err{background:#A32D2D}
.setup-card{background:#fff;border:2px dashed #378ADD;border-radius:12px;padding:2rem;text-align:center;margin-bottom:1rem}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.ig{grid-template-columns:1fr}.tabs{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app" id="root"></div>
<div id="loading-overlay" class="loading-overlay" style="display:none">
  <div class="spinner"></div>
  <div id="loading-text" style="font-size:13px;color:#5f5e5a">กำลังโหลด...</div>
</div>
<div id="toast" class="toast" style="display:none"></div>
<script>

// ======= 🌐 CONNECT TO GOOGLE SHEETS LIVE DATA =======
let GAS_URL = 'https://script.google.com/macros/s/AKfycbzl5te2wmo-3pV-gny0srGCQiQcJxbkp8inHpyJW42vs4HTRWSXFO5cgWM2whhVDLo/exec';

// ─── STATE MANAGEMENT ────────────────────────────────────────
let state = {
  currentTab: 'form', // 'form' | 'status'
  requests: [],
  masterData: { equipment: [], staff: [], positions: [], depts: [] },
  form: {
    name: '', position: '', dept: '', email: '',
    purpose: '', borrowFrom: '', borrowFromTime: '', borrowTo: '', borrowToTime: '',
    equipment: [{ code: '', name: '', location: '', responsible: '', responsibleEmail: '' }]
  },
  activeAc: null, // index of active equipment autocomplete
  selectedRequest: null,
  toastTimeout: null
};

// ─── INIT APP ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  showLoading('กำลังโหลดข้อมูลฐานข้อมูลสดจาก Google Sheets...');
  await fetchMasterData();
  await fetchRequests();
  hideLoading();
  render();
});

// ─── API FETCHES ─────────────────────────────────────────────
async function fetchMasterData() {
  try {
    const res = await fetch(`${GAS_URL}?action=getMasterData`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    state.masterData = data;
  } catch(e) {
    showToast('ดึงฐานข้อมูลล้มเหลว: ' + e.message, 'err');
    console.error(e);
  }
}

async function fetchRequests() {
  try {
    const res = await fetch(`${GAS_URL}?action=getAll`);
    state.requests = await res.json();
  } catch(e) {
    showToast('ดึงรายการคำขอไม่สำเร็จ', 'err');
  }
}

// ─── ACTIONS ─────────────────────────────────────────────────
async function submitForm(e) {
  e.preventDefault();
  if (!state.form.name || !state.form.email || !state.form.borrowFrom || !state.form.borrowTo) {
    showToast('กรุณากรอกข้อมูลสำคัญให้ครบถ้วน', 'err');
    return;
  }
  const validEq = state.form.equipment.filter(eq => eq.code && eq.name);
  if (validEq.length === 0) {
    showToast('กรุณาเลือกครุภัณฑ์อย่างน้อย 1 รายการ', 'err');
    return;
  }

  showLoading('กำลังส่งใบคำขอยืมและระบบกำลังส่งอีเมลแจ้งเตือน...');
  try {
    const payload = { ...state.form, equipment: validEq };
    const res = await fetch(`${GAS_URL}?action=create`, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const r = await res.json();
    if (r.ok) {
      showToast('ส่งคำขอยืมครุภัณฑ์สำเร็จแล้ว!', 'ok');
      // Reset Form
      state.form = {
        name: '', position: '', dept: '', email: '',
        purpose: '', borrowFrom: '', borrowFromTime: '', borrowTo: '', borrowToTime: '',
        equipment: [{ code: '', name: '', location: '', responsible: '', responsibleEmail: '' }]
      };
      state.currentTab = 'status';
      await fetchRequests();
    } else {
      throw new Error(r.error);
    }
  } catch(e) {
    showToast('เกิดข้อผิดพลาด: ' + e.message, 'err');
  } finally {
    hideLoading();
    render();
  }
}

async function handleUpdateStatus(id, nextStatus, updatedEquipment = null) {
  showLoading('กำลังบันทึกสถานะใหม่ลงฐานข้อมูล...');
  try {
    const payload = { id, status: nextStatus };
    if (updatedEquipment) payload.equipment = updatedEquipment;

    const res = await fetch(`${GAS_URL}?action=updateStatus`, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const r = await res.json();
    if (r.ok) {
      showToast(`เปลี่ยนสถานะเป็น "${nextStatus}" เรียบร้อย`, 'ok');
      state.selectedRequest = null;
      await fetchRequests();
    } else {
      throw new Error(r.error);
    }
  } catch(e) {
    showToast('อัปเดตไม่สำเร็จ: ' + e.message, 'err');
  } finally {
    hideLoading();
    render();
  }
}

// ─── UI HELPERS ──────────────────────────────────────────────
function showLoading(t) {
  document.getElementById('loading-text').innerText = t || 'กำลังโหลด...';
  document.getElementById('loading-overlay').style.display = 'flex';
}
function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = `toast toast-${type}`;
  t.style.display = 'flex';
  clearTimeout(state.toastTimeout);
  state.toastTimeout = setTimeout(() => t.style.display = 'none', 4000);
}

// ─── RENDER ENGINE ───────────────────────────────────────────
function render() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="header">
      <div class="logo"><i class="ti ti-building-hospital"></i></div>
      <div class="header-info">
        <h1 class="header-title">ระบบยืม-คืนครุภัณฑ์</h1>
        <p class="header-sub">โรงพยาบาลสัตว์ คณะสัตวแพทยศาสตร์ มหาวิทยาลัยสงขลานครินทร์</p>
      </div>
    </div>

    <div class="status-bar">
      <div class="dot ${GAS_URL ? 'dot-green' : 'dot-red'}"></div>
      <span>${GAS_URL ? 'เชื่อมต่อฐานข้อมูลระบบ Google Sheets เรียบร้อย (ข้อมูลอัปเดตสด)' : 'ไม่ได้เชื่อมต่อ API'}</span>
    </div>

    <div class="tabs">
      <button class="tab ${state.currentTab==='form'?'active':''}" onclick="switchTab('form')">
        <i class="ti ti-file-plus"></i> แบบฟอร์มขอยืมครุภัณฑ์
      </button>
      <button class="tab ${state.currentTab==='status'?'active':''}" onclick="switchTab('status')">
        <i class="ti ti-list-check"></i> ตรวจสอบสถานะและอนุมัติ 
        ${state.requests.length ? `<span class="badge">${state.requests.length}</span>` : ''}
      </button>
    </div>

    ${state.currentTab === 'form' ? renderFormSection() : renderStatusSection()}

    ${state.selectedRequest ? renderModal() : ''}
  `;
}

function switchTab(t) { state.currentTab = t; render(); }

// ─── FORM VIEW ────────────────────────────────────────────────
function renderFormSection() {
  // สร้างตัวเลือกตำแหน่งและสังกัดจาก MasterData
  const optDepts = state.masterData.depts.map(d => `<option value="${d}">${d}</option>`).join('');
  const optPositions = state.masterData.positions.map(p => `<option value="${p}">${p}</option>`).join('');

  return `
    <form onsubmit="submitForm(event)">
      <div class="card">
        <h2 class="section-title"><i class="ti ti-user"></i> ข้อมูลผู้ขอยืมครุภัณฑ์</h2>
        
        <div class="field ac-wrap">
          <label>ค้นหารายชื่อบุคลากร <span class="req">*</span></label>
          <input type="text" placeholder="พิมพ์ชื่อ-นามสกุล เพื่อค้นหาข้อมูลอัตโนมัติ..." value="${state.form.name}" oninput="searchStaff(this.value)">
          <div id="ac-staff" class="ac-drop" style="display:none"></div>
        </div>

        <div class="grid2">
          <div class="field">
            <label>ตำแหน่ง</label>
            <select onchange="state.form.position=this.value" id="f-pos">
              <option value="">-- เลือกตำแหน่ง --</option>
              ${optPositions}
            </select>
          </div>
          <div class="field">
            <label>ฝ่าย / แผนก / สังกัด</label>
            <select onchange="state.form.dept=this.value" id="f-dept">
              <option value="">-- เลือกฝ่าย/สังกัด --</option>
              ${optDepts}
            </select>
          </div>
        </div>
        <div class="field">
          <label>อีเมล (เพื่อรับผลอนุมัติ) <span class="req">*</span></label>
          <input type="email" required placeholder="example@psu.ac.th" value="${state.form.email}" oninput="state.form.email=this.value">
        </div>
      </div>

      <div class="card">
        <h2 class="section-title"><i class="ti ti-calendar-event"></i> รายละเอียดและกำหนดเวลาการยืม</h2>
        <div class="field">
          <label>วัตถุประสงค์การใช้งาน</label>
          <textarea placeholder="ระบุเหตุผลความจำเป็นในการยืมใช้งาน..." oninput="state.form.purpose=this.value">${state.form.purpose}</textarea>
        </div>
        <div class="grid2">
          <div class="field">
            <label>ยืมตั้งแต่วันที่ <span class="req">*</span></label>
            <input type="date" required value="${state.form.borrowFrom}" onchange="state.form.borrowFrom=this.value">
            <input type="time" style="margin-top:6px" value="${state.form.borrowFromTime}" onchange="state.form.borrowFromTime=this.value">
          </div>
          <div class="field">
            <label>ถึงวันที่ (กำหนดคืน) <span class="req">*</span></label>
            <input type="date" required value="${state.form.borrowTo}" onchange="state.form.borrowTo=this.value">
            <input type="time" style="margin-top:6px" value="${state.form.borrowToTime}" onchange="state.form.borrowToTime=this.value">
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title"><i class="ti ti-package"></i> รายการครุภัณฑ์ที่ต้องการยืม</h2>
        <div id="equipment-list">
          ${state.form.equipment.map((eq, idx) => renderEquipmentRow(eq, idx)).join('')}
        </div>
        <button type="button" class="btn-add" onclick="addEquipmentRow()">
          <i class="ti ti-plus"></i> เพิ่มครุภัณฑ์อีก 1 รายการ
        </button>
      </div>

      <div style="display:flex;justify-content:flex-end">
        <button type="submit" class="btn-primary"><i class="ti ti-send"></i> ส่งเอกสารคำขอยืมครุภัณฑ์</button>
      </div>
    </form>
  `;
}

function renderEquipmentRow(eq, idx) {
  return `
    <div class="eq-row">
      <div class="eq-header">
        <span class="eq-label">ครุภัณฑ์รายการที่ ${idx+1}</span>
        ${idx > 0 ? `<button type="button" class="btn-remove" onclick="removeEquipmentRow(${idx})"><i class="ti ti-trash"></i></button>` : ''}
      </div>
      <div class="field ac-wrap">
        <label>ค้นหา ครุภัณฑ์ (พิมพ์รหัสหรือชื่อครุภัณฑ์) <span class="req">*</span></label>
        <input type="text" placeholder="พิมพ์คำค้นหาเพื่อเลือกครุภัณฑ์..." value="${eq.name ? `${eq.name} (${eq.code})` : ''}" oninput="searchEquipment(this.value, ${idx})" onfocus="state.activeAc=${idx}">
        <div id="ac-eq-${idx}" class="ac-drop" style="display:none"></div>
      </div>
      ${eq.code ? `
        <div class="info-box">
          <i class="ti ti-info-circle" style="font-size:16px"></i>
          <div>
            <b>รหัส:</b> ${eq.code} | <b>สถานที่ตั้งปกติ:</b> ${eq.location}<br>
            <b>ผู้รับผิดชอบดูแล:</b> ${eq.responsible} (${eq.responsibleEmail || 'ไม่มีข้อมูลอีเมล'})
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

// ─── FORM LOGIC ──────────────────────────────────────────────
function addEquipmentRow() {
  state.form.equipment.push({ code: '', name: '', location: '', responsible: '', responsibleEmail: '' });
  render();
}
function removeEquipmentRow(idx) {
  state.form.equipment.splice(idx, 1);
  render();
}

function searchStaff(val) {
  state.form.name = val;
  const drop = document.getElementById('ac-staff');
  if (!val.trim()) { drop.style.display = 'none'; return; }
  
  const match = state.masterData.staff.filter(s => s.name.toLowerCase().includes(val.toLowerCase())).slice(0, 6);
  if (!match.length) { drop.style.display = 'none'; return; }

  drop.innerHTML = match.map(s => `
    <div class="ac-item" onclick="selectStaff('${s.name}','${s.position}','${s.dept}','${s.email}')">
      <b>${s.name}</b> <span style="font-size:11px;color:#666">(${s.dept})</span>
    </div>
  `).join('');
  drop.style.display = 'block';
}

function selectStaff(name, pos, dept, email) {
  state.form.name = name;
  state.form.email = email;
  state.form.position = pos;
  state.form.dept = dept;
  document.getElementById('ac-staff').style.display = 'none';
  render();
  // เลือก dropdown อัตโนมัติ
  setTimeout(() => {
    if (document.getElementById('f-pos')) document.getElementById('f-pos').value = pos;
    if (document.getElementById('f-dept')) document.getElementById('f-dept').value = dept;
  }, 50);
}

function searchEquipment(val, idx) {
  const drop = document.getElementById(`ac-eq-${idx}`);
  if (!val.trim()) { drop.style.display = 'none'; return; }

  const match = state.masterData.equipment.filter(e => 
    e.name.toLowerCase().includes(val.toLowerCase()) || 
    e.code.toLowerCase().includes(val.toLowerCase())
  ).slice(0, 6);

  if (!match.length) { drop.style.display = 'none'; return; }

  drop.innerHTML = match.map(e => `
    <div class="ac-item" onclick="selectEquipment(${idx}, ${JSON.stringify(e).replace(/"/g, '&quot;')})">
      <b>${e.name}</b><br><span style="font-size:11px;color:#5f5e5a">${e.code}</span>
    </div>
  `).join('');
  drop.style.display = 'block';
}

function selectEquipment(idx, item) {
  state.form.equipment[idx] = {
    code: item.code,
    name: item.name,
    location: item.location,
    responsible: item.responsible,
    responsibleEmail: item.responsibleEmail
  };
  render();
}

// ─── STATUS VIEW ─────────────────────────────────────────────
function renderStatusSection() {
  if (state.requests.length === 0) {
    return `<div class="card empty"><i class="ti ti-folder-off"></i>ยังไม่มีประวัติใบคำขอยืมครุภัณฑ์ในระบบ</div>`;
  }
  return state.requests.map(r => {
    let sCls = 's-pending';
    if(r.status==='อนุมัติแล้ว') sCls='s-approved';
    if(r.status==='ปฏิเสธคำขอ') sCls='s-rejected';
    if(r.status==='รับทราบแล้ว') sCls='s-ack';
    if(r.status==='ยืมครุภัณฑ์แล้ว') sCls='s-borrowed';
    if(r.status==='คืนครุภัณฑ์แล้ว') sCls='s-returned';
    if(r.status==='เสร็จสิ้น') sCls='s-done';

    const count = Array.isArray(r.equipmentJSON) ? r.equipmentJSON.length : 0;
    const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

    return `
      <div class="req-card" onclick="state.selectedRequest = ${JSON.stringify(r).replace(/"/g, '&quot;')}; render();">
        <div class="req-top">
          <div>
            <div class="req-name">${r.requesterName}</div>
            <div class="req-meta">${r.requesterDept || 'ไม่ระบุสังกัด'} | ครุภัณฑ์ที่ยืม: <b>${count} รายการ</b></div>
          </div>
          <span class="sbadge ${sCls}">${r.status}</span>
        </div>
        <div class="req-footer">
          <span>เลขที่คำขอ: ${r.id}</span>
          <span>ยื่นเมื่อ: ${dateStr} น.</span>
        </div>
      </div>
    `;
  }).join('');
}

// ─── MODAL DETAIL & WORKFLOW MANAGER ─────────────────────────
function renderModal() {
  const r = state.selectedRequest;
  const eqList = Array.isArray(r.equipmentJSON) ? r.equipmentJSON : [];
  
  // จัดการสีของสเต็ปบน Timeline
  const getStepStatus = (stepIndex) => {
    const s = r.status;
    if (stepIndex === 1) return 'td-done'; // ยื่นคำขอเสมอ
    if (stepIndex === 2) { // ขั้นตอนอนุมัติ
      if (s === 'ยื่นขออนุมัติ') return 'td-cur';
      if (s === 'ปฏิเสธคำขอ') return 'td-bad';
      return 'td-done';
    }
    if (stepIndex === 3) { // ผู้ดูแลครุภัณฑ์รับทราบ
      if (s === 'อนุมัติแล้ว') return 'td-cur';
      if (s === 'ปฏิเสธคำขอ') return 'td-wait';
      return 'td-done';
    }
    if (stepIndex === 4) { // รับครุภัณฑ์ไปใช้งาน
      if (s === 'รับทราบแล้ว') return 'td-cur';
      if (s === 'ยื่นขออนุมัติ' || s === 'อนุมัติแล้ว' || s === 'ปฏิเสธคำขอ') return 'td-wait';
      return 'td-done';
    }
    if (stepIndex === 5) { // คืนครุภัณฑ์และตรวจสอบ
      if (s === 'ยืมครุภัณฑ์แล้ว') return 'td-cur';
      if (s === 'คืนครุภัณฑ์แล้ว' || s === 'เสร็จสิ้น') return 'td-done';
      return 'td-wait';
    }
    return 'td-wait';
  };

  return `
    <div class="modal-bg" onclick="if(event.target===this){state.selectedRequest=null;render();}">
      <div class="modal">
        <div class="modal-hdr">
          <h3 class="modal-title">รายละเอียดใบคำขอเอกสาร เลขที่ ${r.id}</h3>
          <button class="btn-close" onclick="state.selectedRequest=null;render();">&times;</button>
        </div>

        <div class="grid2" style="margin-bottom:1.5rem">
          <div>
            <div class="step-label"><i class="ti ti-file-text"></i> ข้อมูลผู้ขอยืม</div>
            <div class="ig"><span class="il">ชื่อ-นามสกุล:</span><span><b>${r.requesterName}</b></span></div>
            <div class="ig"><span class="il">ตำแหน่ง/สังกัด:</span><span>${r.requesterPosition} <br><span style="color:#666">${r.requesterDept}</span></span></div>
            <div class="ig"><span class="il">อีเมลติดต่อ:</span><span>${r.requesterEmail}</span></div>
            <div class="ig"><span class="il">วัตถุประสงค์:</span><span>${r.purpose || '—'}</span></div>
            <div class="ig"><span class="il">กำหนดเวลายืม:</span><span>${r.borrowFrom} ${r.borrowFromTime||''} ถึง ${r.borrowTo} ${r.borrowToTime||''}</span></div>
          </div>

          <div>
            <div class="step-label"><i class="ti ti-git-commit"></i> ความคืบหน้าของขั้นตอน (Workflow)</div>
            <div class="tl">
              <div class="tl-item">
                <div class="tl-dot ${getStepStatus(1)}"><i class="ti ti-check"></i></div>
                <div class="tl-body"><div class="tl-t">ยื่นคำขอเข้าสู่ระบบ</div></div>
              </div>
              <div class="tl-item">
                <div class="tl-dot ${getStepStatus(2)}">2</div>
                <div class="tl-body"><div class="tl-t">หัวหน้าฝ่าย/ผู้มีอำนาจ พิจารณาอนุมัติ</div></div>
              </div>
              <div class="tl-item">
                <div class="tl-dot ${getStepStatus(3)}">3</div>
                <div class="tl-body"><div class="tl-t">ผู้รับผิดชอบครุภัณฑ์ รับทราบและเตรียมของ</div></div>
              </div>
              <div class="tl-item">
                <div class="tl-dot ${getStepStatus(4)}">4</div>
                <div class="tl-body"><div class="tl-t">ผู้ขอยืม ยืนยันรับครุภัณฑ์ไปใช้งาน</div></div>
              </div>
              <div class="tl-item">
                <div class="tl-dot ${getStepStatus(5)}">5</div>
                <div class="tl-body"><div class="tl-t">ส่งคืนครุภัณฑ์ และบันทึกสภาพหลังคืน</div></div>
              </div>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="step-label"><i class="ti ti-box"></i> รายการครุภัณฑ์และบันทึกตรวจสอบสภาพ</div>
        
        <div style="margin-bottom:1rem">
          ${eqList.map((eq, i) => `
            <div class="eq-info-card">
              <div class="eq-info-name">${i+1}. ${eq.name}</div>
              <div style="font-size:11px;color:#5f5e5a;margin-bottom:8px">
                รหัสครุภัณฑ์: <b>${eq.code}</b> | ผู้ดูแล: ${eq.responsible}
              </div>
              
              <div class="grid2">
                <div>
                  <label style="font-size:11px;color:#666">สภาพก่อนยืม (ผู้ดูแลระบุ):</label>
                  ${r.status === 'อนุมัติแล้ว' ? `
                    <select class="cond-sel" id="cond-b-${i}">
                      <option value="ปกติสมบูรณ์">ปกติสมบูรณ์</option>
                      <option value="ชำรุดบางส่วน">ชำรุดบางส่วน (มีตำหนิ)</option>
                    </select>
                  ` : `<div><b>${eq.condBefore || '—'}</b></div>`}
                </div>
                <div>
                  <label style="font-size:11px;color:#666">สภาพหลังคืน (ผู้ดูแลระบุ):</label>
                  ${r.status === 'ยืมครุภัณฑ์แล้ว' ? `
                    <select class="cond-sel" id="cond-a-${i}">
                      <option value="ปกติสมบูรณ์">ปกติสมบูรณ์</option>
                      <option value="ชำรุดจากการใช้งาน">ชำรุดจากการใช้งาน</option>
                      <option value="สูญหาย">สูญหาย</option>
                    </select>
                  ` : `<div><b>${eq.condAfter || '—'}</b></div>`}
                </div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="divider"></div>
        <div class="step-label"><i class="ti ti-adjustments"></i> ส่วนการจัดการสำหรับเจ้าหน้าที่ / ผู้อนุมัติ</div>
        <div class="action-row">
          ${renderActionButtons(r, eqList)}
        </div>
      </div>
    </div>
  `;
}

function renderActionButtons(r, eqList) {
  if (r.status === 'ยื่นขออนุมัติ') {
    return `
      <button class="btn-success" onclick="handleUpdateStatus('${r.id}', 'อนุมัติแล้ว')"><i class="ti ti-circle-check"></i> อนุมัติคำขอ</button>
      <button class="btn-danger" onclick="handleUpdateStatus('${r.id}', 'ปฏิเสธคำขอ')"><i class="ti ti-circle-x"></i> ปฏิเสธการยืม</button>
    `;
  }
  if (r.status === 'อนุมัติแล้ว') {
    return `
      <div style="width:100%"><p style="font-size:12px;color:#BA7517;margin-bottom:8px"><i class="ti ti-alert-circle"></i> สิทธิ์ของผู้ดูแลครุภัณฑ์: ตรวจสอบและลงบันทึกสภาพสินค้าก่อนคลิกรับทราบ</p></div>
      <button class="btn-warn" onclick="submitAck('${r.id}', ${JSON.stringify(eqList).replace(/"/g, '&quot;')})"><i class="ti ti-thumb-up"></i> บันทึกสภาพ & รับทราบการยืม</button>
    `;
  }
  if (r.status === 'รับทราบแล้ว') {
    return `
      <div style="width:100%"><p style="font-size:12px;color:#0C447C;margin-bottom:8px"><i class="ti ti-info-circle"></i> ขั้นตอนของผู้ขอยืม: กรุณากดปุ่มด้านล่างนี้เมื่อได้รับครุภัณฑ์จริงไปใช้งานแล้ว</p></div>
      <button class="btn-primary" onclick="handleUpdateStatus('${r.id}', 'ยืมครุภัณฑ์แล้ว')"><i class="ti ti-player-play"></i> ยืนยันรับครุภัณฑ์เรียบร้อย</button>
    `;
  }
  if (r.status === 'ยืมครุภัณฑ์แล้ว') {
    return `
      <div style="width:100%"><p style="font-size:12px;color:#3B6D11;margin-bottom:8px"><i class="ti ti-refresh"></i> ขั้นตอนการส่งคืน: ผู้ดูแลครุภัณฑ์ตรวจสภาพและกดบันทึกรับคืน</p></div>
      <button class="btn-success" onclick="submitReturn('${r.id}', ${JSON.stringify(eqList).replace(/"/g, '&quot;')})"><i class="ti ti-archive"></i> ตรวจรับคืนครุภัณฑ์สำเร็จ</button>
    `;
  }
  return `<span style="font-size:12px;color:#888">ใบคำขอนี้เสร็จสิ้นกระบวนการในระบบแล้ว</span>`;
}

// ─── WORKFLOW SAVING HELPERS ────────────────────────────────
function submitAck(id, eqList) {
  const updated = eqList.map((eq, i) => {
    eq.condBefore = document.getElementById(`cond-b-${i}`).value;
    return eq;
  });
  handleUpdateStatus(id, 'รับทราบแล้ว', updated);
}

function submitReturn(id, eqList) {
  const updated = eqList.map((eq, i) => {
    eq.condAfter = document.getElementById(`cond-a-${i}`).value;
    return eq;
  });
  handleUpdateStatus(id, 'เสร็จสิ้น', updated);
}

</script>
</body>
</html>
