<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบยืม-คืนครุภัณฑ์ - รพ.สัตว์ มอ.</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 md:p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">ระบบยืม-คืนครุภัณฑ์</h1>
    <p class="text-slate-500 text-sm mb-6">โรงพยาบาลสัตว์ มหาวิทยาลัยสงขลานครินทร์</p>

    <!-- เมนูแท็บสลับหน้า -->
    <div class="flex border-b mb-6 overflow-x-auto text-sm sm:text-base">
      <button id="tabFormBtn" onclick="switchTab('form')" class="py-2.5 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 whitespace-nowrap">
        📝 แบบฟอร์มขอยืม
      </button>
      <button id="tabTrackBtn" onclick="switchTab('track')" class="py-2.5 px-4 font-semibold text-slate-500 hover:text-blue-600 border-b-2 border-transparent whitespace-nowrap">
        🔍 ติดตามสถานะ (ผู้ยืม)
      </button>
      <button id="tabApproveBtn" onclick="switchTab('approve')" class="py-2.5 px-4 font-semibold text-slate-500 hover:text-blue-600 border-b-2 border-transparent whitespace-nowrap">
        🛡️ อนุมัติคำขอ (เจ้าของ/ผู้มีอำนาจ)
      </button>
    </div>

    <!-- สถานะการโหลด -->
    <div id="loadingStatus" class="mb-4 p-3 bg-blue-50 text-blue-700 rounded-lg text-sm flex items-center">
      <span>⏳ กำลังโหลดข้อมูล...</span>
    </div>

    <!-- ==================== TAB 1: แบบฟอร์มขอยืม ==================== -->
    <form id="borrowForm" onsubmit="handleSubmit(event)" class="space-y-6 hidden">
      <div class="border-b pb-4">
        <h2 class="text-lg font-semibold text-slate-700 mb-3">1. ข้อมูลผู้ขอยืม</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">เลือกชื่อผู้ขอยืม *</label>
            <select id="staffSelect" onchange="autoFillStaffInfo()" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
              <option value="">-- เลือกรายชื่อบุคลากร --</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ตำแหน่ง</label>
            <input type="text" id="position" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg" readonly>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">สังกัด/ฝ่าย</label>
            <input type="text" id="dept" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg" readonly>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
            <input type="email" id="email" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg" readonly required>
          </div>
        </div>
      </div>

      <div class="border-b pb-4">
        <h2 class="text-lg font-semibold text-slate-700 mb-3">2. วัตถุประสงค์และกำหนดเวลา</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">วัตถุประสงค์ในการยืม *</label>
            <textarea id="purpose" rows="2" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="ระบุเหตุผลในการนำไปใช้งาน" required></textarea>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">ยืมตั้งแต่วันที่ *</label>
              <input type="date" id="borrowFrom" class="w-full p-2.5 border border-slate-300 rounded-lg" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">เวลา</label>
              <input type="time" id="borrowFromTime" value="09:00" class="w-full p-2.5 border border-slate-300 rounded-lg">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">ถึงวันที่ *</label>
              <input type="date" id="borrowTo" class="w-full p-2.5 border border-slate-300 rounded-lg" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">เวลา</label>
              <input type="time" id="borrowToTime" value="16:00" class="w-full p-2.5 border border-slate-300 rounded-lg">
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-semibold text-slate-700">3. เลือกรายการครุภัณฑ์</h2>
          <span id="selectedCount" class="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-medium">เลือกแล้ว 0 รายการ</span>
        </div>
        <div class="mb-3">
          <input type="text" id="eqSearchInput" oninput="filterEquipment()" 
                 placeholder="🔍 พิมพ์เพื่อค้นหาชื่อ, รหัสครุภัณฑ์, สถานที่ หรือผู้ดูแล..." 
                 class="w-full p-2.5 border border-blue-300 rounded-lg bg-blue-50/50 focus:bg-white focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div id="equipmentContainer" class="space-y-2 max-h-72 overflow-y-auto border p-3 rounded-lg bg-slate-50"></div>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition shadow">
        ยื่นคำขอยืมครุภัณฑ์
      </button>
    </form>

    <!-- ==================== TAB 2: ติดตามสถานะ (ผู้ยืม) ==================== -->
    <div id="trackSection" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border">
        <h2 class="text-lg font-semibold text-slate-700">รายการติดตามการยืมของคุณ</h2>
        <button onclick="loadTrackingRequests()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded text-sm text-slate-700 font-medium transition">🔄 รีเฟรช</button>
      </div>
      <div id="trackListContainer" class="space-y-4"></div>
    </div>

    <!-- ==================== TAB 3: อนุมัติคำขอ (เจ้าของ / ผู้มีอำนาจ) ==================== -->
    <div id="approveSection" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border">
        <h2 class="text-lg font-semibold text-slate-700">จัดการคำขอและอนุมัติ</h2>
        <button onclick="loadApprovalRequests()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 rounded text-sm text-slate-700 font-medium transition">🔄 รีเฟรช</button>
      </div>
      <div id="approveListContainer" class="space-y-4"></div>
    </div>

  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzl5te2wmo-3pV-gny0srGCQiQcJxbkp8inHpyJW42vs4HTRWSXFO5cgWM2whhVDLo/exec';

    let masterData = { staff: [], equipment: [] };
    let selectedEqCodes = new Set();

    window.onload = async function() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=getMasterData`);
        masterData = await response.json();
        if (masterData.error) throw new Error(masterData.error);

        renderStaffDropdown(masterData.staff);
        renderEquipmentList(masterData.equipment);

        document.getElementById('loadingStatus').classList.add('hidden');
        document.getElementById('borrowForm').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loadingStatus').className = "p-3 bg-red-50 text-red-700 rounded-lg text-sm";
        document.getElementById('loadingStatus').innerHTML = `❌ ไม่สามารถโหลดข้อมูลได้: ${err.message}`;
      }
    };

    // ฟังก์ชันจัดฟอร์แมต วันที่ และ เวลา
    function formatDateTimeDisplay(dateStr, timeStr) {
      if (!dateStr) return '-';
      let dateObj = new Date(dateStr);
      if (isNaN(dateObj.getTime())) {
        return `${dateStr} ${timeStr ? 'เวลา ' + timeStr + ' น.' : ''}`;
      }
      let yyyy = dateObj.getFullYear();
      let mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      let dd = String(dateObj.getDate()).padStart(2, '0');
      let timeFormatted = timeStr ? ` เวลา ${timeStr} น.` : '';
      return `${yyyy}-${mm}-${dd}${timeFormatted}`;
    }

    // สลับหน้าแท็บ
    function switchTab(tab) {
      const form = document.getElementById('borrowForm');
      const track = document.getElementById('trackSection');
      const approve = document.getElementById('approveSection');

      const btnForm = document.getElementById('tabFormBtn');
      const btnTrack = document.getElementById('tabTrackBtn');
      const btnApprove = document.getElementById('tabApproveBtn');

      // ซ่อนทั้งหมดก่อน
      form.classList.add('hidden');
      track.classList.add('hidden');
      approve.classList.add('hidden');

      btnForm.className = "py-2.5 px-4 font-semibold text-slate-500 hover:text-blue-600 border-b-2 border-transparent whitespace-nowrap";
      btnTrack.className = "py-2.5 px-4 font-semibold text-slate-500 hover:text-blue-600 border-b-2 border-transparent whitespace-nowrap";
      btnApprove.className = "py-2.5 px-4 font-semibold text-slate-500 hover:text-blue-600 border-b-2 border-transparent whitespace-nowrap";

      if (tab === 'form') {
        form.classList.remove('hidden');
        btnForm.className = "py-2.5 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 whitespace-nowrap";
      } else if (tab === 'track') {
        track.classList.remove('hidden');
        btnTrack.className = "py-2.5 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 whitespace-nowrap";
        loadTrackingRequests();
      } else if (tab === 'approve') {
        approve.classList.remove('hidden');
        btnApprove.className = "py-2.5 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 whitespace-nowrap";
        loadApprovalRequests();
      }
    }

    // Render Dropdown
    function renderStaffDropdown(staffList) {
      const select = document.getElementById('staffSelect');
      staffList.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = `${s.name} (${s.dept})`;
        select.appendChild(opt);
      });
    }

    function autoFillStaffInfo() {
      const selectedName = document.getElementById('staffSelect').value;
      const staff = masterData.staff.find(s => s.name === selectedName);
      document.getElementById('position').value = staff ? staff.position : '';
      document.getElementById('dept').value = staff ? staff.dept : '';
      document.getElementById('email').value = staff ? staff.email : '';
    }

    function filterEquipment() {
      const q = document.getElementById('eqSearchInput').value.toLowerCase().trim();
      const filtered = masterData.equipment.filter(eq => 
        (eq.name && eq.name.toLowerCase().includes(q)) ||
        (eq.code && eq.code.toLowerCase().includes(q)) ||
        (eq.location && eq.location.toLowerCase().includes(q)) ||
        (eq.responsible && eq.responsible.toLowerCase().includes(q))
      );
      renderEquipmentList(filtered);
    }

    function renderEquipmentList(eqList) {
      const container = document.getElementById('equipmentContainer');
      if (!eqList || eqList.length === 0) {
        container.innerHTML = '<p class="text-slate-400 text-sm py-4 text-center">ไม่พบรายการครุภัณฑ์ที่ค้นหา</p>';
        return;
      }
      container.innerHTML = eqList.map(eq => {
        const isChecked = selectedEqCodes.has(eq.code) ? 'checked' : '';
        return `
          <label class="flex items-start space-x-3 p-2.5 bg-white rounded-lg border hover:bg-blue-50/50 cursor-pointer text-sm">
            <input type="checkbox" value="${eq.code}" ${isChecked} onchange="toggleEqSelect('${eq.code}')" class="mt-1 rounded text-blue-600">
            <div class="flex-1">
              <div class="font-medium text-slate-800">${eq.name}</div>
              <div class="text-xs text-slate-500 mt-0.5">
                <span class="bg-slate-100 px-1.5 py-0.5 rounded border">รหัส: ${eq.code}</span>
                <span class="ml-1">📍 ${eq.location}</span>
                <span class="ml-1">👤 ${eq.responsible}</span>
              </div>
            </div>
          </label>
        `;
      }).join('');
    }

    function toggleEqSelect(code) {
      if (selectedEqCodes.has(code)) selectedEqCodes.delete(code);
      else selectedEqCodes.add(code);
      document.getElementById('selectedCount').textContent = `เลือกแล้ว ${selectedEqCodes.size} รายการ`;
    }

    // ยื่นคำขอ
    async function handleSubmit(e) {
      e.preventDefault();
      if (selectedEqCodes.size === 0) {
        alert('กรุณาเลือกครุภัณฑ์อย่างน้อย 1 รายการ');
        return;
      }

      const selectedEquipment = masterData.equipment.filter(eq => selectedEqCodes.has(eq.code));
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่งข้อมูล...';

      const payload = {
        name: document.getElementById('staffSelect').value,
        position: document.getElementById('position').value,
        dept: document.getElementById('dept').value,
        email: document.getElementById('email').value,
        purpose: document.getElementById('purpose').value,
        borrowFrom: document.getElementById('borrowFrom').value,
        borrowFromTime: document.getElementById('borrowFromTime').value,
        borrowTo: document.getElementById('borrowTo').value,
        borrowToTime: document.getElementById('borrowToTime').value,
        equipment: selectedEquipment
      };

      try {
        const res = await fetch(`${WEB_APP_URL}?action=create`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.ok) {
          alert(`บันทึกคำขอเรียบร้อยแล้ว! เลขที่คำขอ: ${result.id}`);
          document.getElementById('borrowForm').reset();
          selectedEqCodes.clear();
          document.getElementById('selectedCount').textContent = `เลือกแล้ว 0 รายการ`;
          renderEquipmentList(masterData.equipment);
          autoFillStaffInfo();
        } else {
          alert(`เกิดข้อผิดพลาด: ${result.error}`);
        }
      } catch (err) {
        alert(`เกิดข้อผิดพลาด: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'ยื่นคำขอยืมครุภัณฑ์';
      }
    }

    // ==================== 1. หน้าติดตามสถานะ (สำหรับผู้ยืม) ====================
    async function loadTrackingRequests() {
      const container = document.getElementById('trackListContainer');
      container.innerHTML = '<div class="text-center text-slate-500 py-8">⏳ กำลังดึงข้อมูล...</div>';
      try {
        const res = await fetch(`${WEB_APP_URL}?action=getAll`);
        const requests = await res.json();
        if (!Array.isArray(requests) || requests.length === 0) {
          container.innerHTML = '<div class="text-center text-slate-400 py-8">ไม่พบข้อมูลคำขอ</div>';
          return;
        }

        container.innerHTML = requests.map(r => {
          const eqList = Array.isArray(r.equipmentJSON) ? r.equipmentJSON : [];
          const borrowFromStr = formatDateTimeDisplay(r.borrowFrom, r.borrowFromTime);
          const borrowToStr = formatDateTimeDisplay(r.borrowTo, r.borrowToTime);

          // ตรวจสอบสิทธิ์การกด "คืนครุภัณฑ์"
          const canReturn = (r.status === 'อนุมัติแล้ว' || r.status === 'เจ้าของให้ยืมแล้ว');

          return `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
              <div class="flex justify-between items-center border-b pb-2">
                <span class="font-bold text-blue-700 text-base sm:text-lg">${r.id}</span>
                <span class="px-3 py-1 text-xs font-semibold rounded-full ${getStatusBadgeClass(r.status)}">
                  ${r.status || 'ยื่นขออนุมัติ'}
                </span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-700">
                <div><strong>ผู้ขอยืม:</strong> ${r.requesterName || '-'}</div>
                <div><strong>วัตถุประสงค์:</strong> ${r.purpose || '-'}</div>
                <div><strong>ยืมวันที่:</strong> ${borrowFromStr}</div>
                <div><strong>คืนวันที่:</strong> ${borrowToStr}</div>
              </div>
              <div class="bg-slate-50 p-2.5 rounded-lg border text-xs text-slate-600">
                <strong>รายการครุภัณฑ์:</strong>
                <ul class="list-disc list-inside mt-1">
                  ${eqList.map(e => `<li>${e.name} (${e.code})</li>`).join('')}
                </ul>
              </div>
              ${canReturn ? `
                <div class="pt-2 flex justify-end">
                  <button onclick="updateRequestStatus('${r.id}', 'ผู้ยืมแจ้งส่งคืนแล้ว')" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-lg shadow transition">
                    📦 กดส่งคืนครุภัณฑ์
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="text-red-500 p-4 bg-red-50 rounded">เกิดข้อผิดพลาด: ${err.message}</div>`;
      }
    }

    // ==================== 2. หน้าอนุมัติคำขอ (เจ้าของ / ผู้มีอำนาจ) ====================
    async function loadApprovalRequests() {
      const container = document.getElementById('approveListContainer');
      container.innerHTML = '<div class="text-center text-slate-500 py-8">⏳ กำลังดึงข้อมูลคำขอ...</div>';
      try {
        const res = await fetch(`${WEB_APP_URL}?action=getAll`);
        const requests = await res.json();
        if (!Array.isArray(requests) || requests.length === 0) {
          container.innerHTML = '<div class="text-center text-slate-400 py-8">ไม่มีรายการคำขออนุมัติ</div>';
          return;
        }

        container.innerHTML = requests.map(r => {
          const eqList = Array.isArray(r.equipmentJSON) ? r.equipmentJSON : [];
          const borrowFromStr = formatDateTimeDisplay(r.borrowFrom, r.borrowFromTime);
          const borrowToStr = formatDateTimeDisplay(r.borrowTo, r.borrowToTime);

          const isOwnerApproved = r.status === 'เจ้าของให้ยืมแล้ว' || r.status === 'อนุมัติแล้ว' || r.status === 'ผู้ยืมแจ้งส่งคืนแล้ว' || r.status === 'รับคืนเรียบร้อย';

          return `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
              <div class="flex justify-between items-center border-b pb-2">
                <div>
                  <span class="font-bold text-blue-700 text-base sm:text-lg">${r.id}</span>
                  <span class="text-xs text-slate-400 ml-2">ยื่นเมื่อ: ${r.createdAt ? new Date(r.createdAt).toLocaleString('th-TH') : '-'}</span>
                </div>
                <span class="px-3 py-1 text-xs font-semibold rounded-full ${getStatusBadgeClass(r.status)}">
                  ${r.status || 'ยื่นขออนุมัติ'}
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-slate-700">
                <div><strong>ผู้ขอยืม:</strong> ${r.requesterName || '-'} (${r.requesterDept || '-'})</div>
                <div><strong>อีเมล:</strong> ${r.requesterEmail || '-'}</div>
                <div><strong>ยืมวันที่:</strong> ${borrowFromStr}</div>
                <div><strong>คืนวันที่:</strong> ${borrowToStr}</div>
                <div class="sm:col-span-2"><strong>วัตถุประสงค์:</strong> ${r.purpose || '-'}</div>
              </div>

              <div class="bg-slate-50 p-2.5 rounded-lg border text-xs text-slate-600">
                <strong>รายการครุภัณฑ์ (${eqList.length} รายการ):</strong>
                <ul class="list-disc list-inside mt-1">
                  ${eqList.map(e => `<li><span class="font-medium text-slate-800">${e.name}</span> (${e.code}) - ผู้ดูแล: ${e.responsible || '-'}</li>`).join('')}
                </ul>
              </div>

              <!-- ปุ่มการดำเนินงานตามลำดับ -->
              <div class="pt-2 flex flex-wrap gap-2 justify-end border-t">
                <!-- ขั้นตอนที่ 1: เจ้าของกดให้ยืม -->
                <button onclick="updateRequestStatus('${r.id}', 'เจ้าของให้ยืมแล้ว')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg transition">
                  🙋‍♂️ เจ้าของ: ให้ยืม
                </button>

                <!-- ขั้นตอนที่ 2: ผู้มีอำนาจกดอนุมัติ (กดได้ต่อเมื่อเจ้าของกดให้ยืมแล้ว) -->
                <button onclick="checkAndApprove('${r.id}', '${r.status}')" class="px-3 py-1.5 ${isOwnerApproved ? 'bg-green-600 hover:bg-green-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed'} text-white text-xs font-medium rounded-lg transition">
                  ✅ ผู้มีอำนาจ: อนุมัติ
                </button>

                <!-- ปุ่มไม่อนุมัติ -->
                <button onclick="updateRequestStatus('${r.id}', 'ไม่อนุมัติ')" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-medium rounded-lg transition">
                  ❌ ไม่อนุมัติ
                </button>

                <!-- ขั้นตอนสุดท้าย: รับคืนเรียบร้อย -->
                <button onclick="updateRequestStatus('${r.id}', 'รับคืนเรียบร้อย')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-lg transition">
                  📦 เจ้าของ: รับคืนแล้ว
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="text-red-500 p-4 bg-red-50 rounded">เกิดข้อผิดพลาด: ${err.message}</div>`;
      }
    }

    // ตรวจสอบเงื่อนไขผู้มีอำนาจกดอนุมัติ
    function checkAndApprove(id, currentStatus) {
      if (currentStatus !== 'เจ้าของให้ยืมแล้ว') {
        alert('⚠️ ไม่สามารถกดอนุมัติได้: เนื่องจากเจ้าของครุภัณฑ์ยังไม่ได้กด "ให้ยืม"');
        return;
      }
      updateRequestStatus(id, 'อนุมัติแล้ว');
    }

    function getStatusBadgeClass(status) {
      switch (status) {
        case 'เจ้าของให้ยืมแล้ว': return 'bg-indigo-100 text-indigo-800 border border-indigo-300';
        case 'อนุมัติแล้ว': return 'bg-green-100 text-green-800 border border-green-300';
        case 'ผู้ยืมแจ้งส่งคืนแล้ว': return 'bg-amber-100 text-amber-800 border border-amber-300';
        case 'รับคืนเรียบร้อย': return 'bg-blue-100 text-blue-800 border border-blue-300';
        case 'ไม่อนุมัติ': return 'bg-red-100 text-red-800 border border-red-300';
        default: return 'bg-slate-100 text-slate-800 border border-slate-300';
      }
    }

    // อัปเดตสถานะขึ้น Google Sheets
    async function updateRequestStatus(id, newStatus) {
      if (!confirm(`คุณต้องการเปลี่ยนสถานะคำขอ ${id} เป็น "${newStatus}" ใช่หรือไม่?`)) return;

      try {
        const res = await fetch(`${WEB_APP_URL}?action=updateStatus`, {
          method: 'POST',
          body: JSON.stringify({ id: id, status: newStatus })
        });
        const result = await res.json();

        if (result.ok) {
          alert(`อัปเดตสถานะเป็น "${newStatus}" เรียบร้อยแล้ว`);
          const activeTab = document.getElementById('trackSection').classList.contains('hidden') ? 'approve' : 'track';
          if (activeTab === 'approve') loadApprovalRequests();
          else loadTrackingRequests();
        } else {
          alert(`เกิดข้อผิดพลาด: ${result.error}`);
        }
      } catch (err) {
        alert(`เกิดข้อผิดพลาด: ${err.message}`);
      }
    }
  </script>
</body>
</html>
