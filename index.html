<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบยืม-คืนครุภัณฑ์ - รพ.สัตว์ มอ.</title>
  <!-- Tailwind CSS สำหรับตกแต่งหน้าเว็บ -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 md:p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">แบบฟอร์มขอยืมครุภัณฑ์</h1>
    <p class="text-slate-500 text-sm mb-6">โรงพยาบาลสัตว์ มหาวิทยาลัยสงขลานครินทร์</p>

    <!-- สถานะการโหลดข้อมูล -->
    <div id="loadingStatus" class="mb-4 p-3 bg-blue-50 text-blue-700 rounded-lg text-sm flex items-center">
      <span>⏳ กำลังโหลดข้อมูลต้นทางจาก Google Sheets...</span>
    </div>

    <form id="borrowForm" onsubmit="handleSubmit(event)" class="space-y-6 hidden">
      
      <!-- ส่วนที่ 1: ข้อมูลผู้ยืม -->
      <div class="border-b pb-4">
        <h2 class="text-lg font-semibold text-slate-700 mb-3">1. ข้อมูลผู้ขอยืม</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">เลือกชื่อผู้ขอยืม *</label>
            <select id="staffSelect" onchange="autoFillStaffInfo()" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
              <option value="">-- เลือกรายชื่อบุคลากร --</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">ตำแหน่ง</label>
            <input type="text" id="position" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg" readonly>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">สังกัด/ฝ่าย</label>
            <input type="text" id="dept" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg" readonly>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
            <input type="email" id="email" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg" readonly required>
          </div>

        </div>
      </div>

      <!-- ส่วนที่ 2: วัตถุประสงค์และกำหนดเวลา -->
      <div class="border-b pb-4">
        <h2 class="text-lg font-semibold text-slate-700 mb-3">2. วัตถุประสงค์และกำหนดเวลา</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">วัตถุประสงค์ในการยืม *</label>
            <textarea id="purpose" rows="2" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="ระบุเหตุผลในการนำไปใช้งาน" required></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">ยืมตั้งแต่วันที่ *</label>
              <input type="date" id="borrowFrom" class="w-full p-2.5 border border-slate-300 rounded-lg" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">เวลา</label>
              <input type="time" id="borrowFromTime" class="w-full p-2.5 border border-slate-300 rounded-lg">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">ถึงวันที่ *</label>
              <input type="date" id="borrowTo" class="w-full p-2.5 border border-slate-300 rounded-lg" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">เวลา</label>
              <input type="time" id="borrowToTime" class="w-full p-2.5 border border-slate-300 rounded-lg">
            </div>
          </div>
        </div>
      </div>

      <!-- ส่วนที่ 3: เลือกครุภัณฑ์ -->
      <div>
        <h2 class="text-lg font-semibold text-slate-700 mb-3">3. เลือกรายการครุภัณฑ์</h2>
        <div id="equipmentContainer" class="space-y-2 max-h-60 overflow-y-auto border p-3 rounded-lg bg-slate-50">
          <!-- แสดงรายการครุภัณฑ์ผ่าน JS -->
        </div>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">
        ยื่นคำขอยืมครุภัณฑ์
      </button>

    </form>
  </div>

  <script>
    // URL Web App ของคุณ
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzl5te2wmo-3pV-gny0srGCQiQcJxbkp8inHpyJW42vs4HTRWSXFO5cgWM2whhVDLo/exec';

    let masterData = { staff: [], equipment: [] };

    // 1. ดึง Master Data เมื่อโหลดหน้าเว็บ
    window.onload = async function() {
      try {
        const response = await fetch(`${WEB_APP_URL}?action=getMasterData`);
        masterData = await response.json();

        if(masterData.error) throw new Error(masterData.error);

        renderStaffDropdown(masterData.staff);
        renderEquipmentList(masterData.equipment);

        document.getElementById('loadingStatus').classList.add('hidden');
        document.getElementById('borrowForm').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loadingStatus').className = "p-3 bg-red-50 text-red-700 rounded-lg text-sm";
        document.getElementById('loadingStatus').innerHTML = `❌ ไม่สามารถโหลดข้อมูลได้: ${err.message}`;
      }
    };

    // 2. แสดงรายชื่อบุคลากรลงใน Dropdown
    function renderStaffDropdown(staffList) {
      const select = document.getElementById('staffSelect');
      staffList.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.textContent = `${s.name} (${s.dept})`;
        select.appendChild(opt);
      });
    }

    // 3. Auto-fill เมื่อเลือกบุคลากร
    function autoFillStaffInfo() {
      const selectedName = document.getElementById('staffSelect').value;
      const staff = masterData.staff.find(s => s.name === selectedName);

      if (staff) {
        document.getElementById('position').value = staff.position || '';
        document.getElementById('dept').value = staff.dept || '';
        document.getElementById('email').value = staff.email || '';
      } else {
        document.getElementById('position').value = '';
        document.getElementById('dept').value = '';
        document.getElementById('email').value = '';
      }
    }

    // 4. แสดงรายการครุภัณฑ์ (Checkboxes)
    function renderEquipmentList(eqList) {
      const container = document.getElementById('equipmentContainer');
      if (!eqList || eqList.length === 0) {
        container.innerHTML = '<p class="text-slate-400 text-sm">ไม่พบรายการครุภัณฑ์ที่พร้อมใช้งาน</p>';
        return;
      }

      container.innerHTML = eqList.map((eq, i) => `
        <label class="flex items-start space-x-3 p-2 bg-white rounded border hover:bg-slate-100 cursor-pointer text-sm">
          <input type="checkbox" name="selectedEq" value="${i}" class="mt-1 rounded text-blue-600">
          <div>
            <div class="font-medium text-slate-800">${eq.name}</div>
            <div class="text-xs text-slate-500">รหัส: ${eq.code} | สถานที่: ${eq.location} | ผู้ดูแล: ${eq.responsible}</div>
          </div>
        </label>
      `).join('');
    }

    // 5. ส่งฟอร์มบันทึกข้อมูล (Action: create)
    async function handleSubmit(e) {
      e.preventDefault();
      
      const selectedCheckboxes = document.querySelectorAll('input[name="selectedEq"]:checked');
      if (selectedCheckboxes.length === 0) {
        alert('กรุณาเลือกครุภัณฑ์อย่างน้อย 1 รายการ');
        return;
      }

      const selectedEquipment = Array.from(selectedCheckboxes).map(cb => masterData.equipment[cb.value]);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่งข้อมูล...';

      const payload = {
        name: document.getElementById('staffSelect').value,
        position: document.getElementById('position').value,
        dept: document.getElementById('dept').value,
        email: document.getElementById('email').value,
        purpose: document.getElementById('purpose').value,
        borrowFrom: document.getElementById('borrowFrom').value,
        borrowFromTime: document.getElementById('borrowFromTime').value,
        borrowTo: document.getElementById('borrowTo').value,
        borrowToTime: document.getElementById('borrowToTime').value,
        equipment: selectedEquipment
      };

      try {
        const res = await fetch(`${WEB_APP_URL}?action=create`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.ok) {
          alert(`บันทึกคำขอเรียบร้อยแล้ว! เลขที่คำขอ: ${result.id}`);
          document.getElementById('borrowForm').reset();
          autoFillStaffInfo();
        } else {
          alert(`เกิดข้อผิดพลาด: ${result.error}`);
        }
      } catch (err) {
        alert(`เกิดข้อผิดพลาดในการส่งข้อมูล: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'ยื่นคำขอยืมครุภัณฑ์';
      }
    }
  </script>
</body>
</html>
