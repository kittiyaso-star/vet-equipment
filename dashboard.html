<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ดสรุปผลการประเมิน</title>
<style>
  :root {
    --primary: #0f6e56;
    --primary-dark: #085041;
    --border: #d9d9d3;
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #2c2c2a;
    --text-muted: #6b6a64;
    --danger: #a32d2d;
    --warn: #854f0b;
    --good: #27500a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Sarabun", sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 14px; }
  nav { margin-top: 12px; }
  nav a {
    display: inline-block; margin-right: 10px; padding: 8px 16px; border-radius: 8px;
    background: var(--card); border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 14px;
  }
  nav a.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat .num { font-size: 24px; font-weight: 500; }
  .stat .label { font-size: 12px; color: var(--text-muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters input, .filters select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .filters input[type=text] { flex: 1; min-width: 180px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 500; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: #f7f6f2; }
  .badge { padding: 2px 10px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
  .badge.pass { background: #eaf3de; color: var(--good); }
  .badge.improve { background: #faeeda; color: var(--warn); }
  .badge.fail { background: #fcebeb; color: var(--danger); }
  .score-cell { font-weight: 500; }
  .detail-row td { background: #fbfaf7; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 13px; }
  .detail-grid h4 { margin: 0 0 6px; font-size: 13px; color: var(--text-muted); }
  .detail-grid ul { margin: 0; padding-left: 18px; }
  .detail-grid li { margin-bottom: 3px; }
  .empty { color: var(--text-muted); font-size: 14px; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ระบบประเมินทดลองงาน</h1>
    <div class="sub">โรงพยาบาลสัตว์ มหาวิทยาลัยสงขลานครินทร์ — แดชบอร์ดสรุปผล</div>
    <nav>
      <a href="index.html">สร้างรายการประเมิน</a>
      <a href="dashboard.html" class="active">แดชบอร์ดสรุปผล</a>
    </nav>
  </header>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="filters">
      <input type="text" id="searchName" placeholder="ค้นหาชื่อ...">
      <select id="filterType">
        <option value="">ทุกประเภทฟอร์ม</option>
        <option value="vet">สัตวแพทย์</option>
        <option value="staff">บุคลากรทั่วไป</option>
      </select>
      <select id="filterDecision">
        <option value="">ทุกผลสรุป</option>
        <option value="สมควรให้ปฏิบัติงานต่อไป">ผ่าน</option>
        <option value="ควรแก้ไขปรับปรุง">ควรปรับปรุง</option>
        <option value="ไม่สมควรให้ปฏิบัติงานต่อไป">ไม่ผ่าน</option>
      </select>
    </div>
    <div id="tableArea"><div class="empty">กำลังโหลด...</div></div>
  </div>
</div>

<script>
// TODO: แก้เป็น URL ของ Web App ที่ deploy จาก Code.gs
const API_URL = 'https://script.google.com/macros/s/AKfycbz8HWROtIx9FoR01h0XH_NvYnQr4R7OyHrSaTXplChtX896YAOC6wBRxZ6rWupLPaNj/exec';

let allEvals = [];

async function api(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'เกิดข้อผิดพลาด');
  return json.data;
}

function decisionClass(decision) {
  if (decision === 'สมควรให้ปฏิบัติงานต่อไป') return 'pass';
  if (decision === 'ไม่สมควรให้ปฏิบัติงานต่อไป') return 'fail';
  return 'improve';
}
function decisionLabel(decision) {
  if (decision === 'สมควรให้ปฏิบัติงานต่อไป') return 'ผ่าน';
  if (decision === 'ไม่สมควรให้ปฏิบัติงานต่อไป') return 'ไม่ผ่าน';
  return 'ควรปรับปรุง';
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderStats(rows) {
  const total = rows.length;
  const pass = rows.filter(r => r.decision === 'สมควรให้ปฏิบัติงานต่อไป').length;
  const improve = rows.filter(r => r.decision === 'ควรแก้ไขปรับปรุง').length;
  const fail = rows.filter(r => r.decision === 'ไม่สมควรให้ปฏิบัติงานต่อไป').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">ประเมินแล้วทั้งหมด</div></div>
    <div class="stat"><div class="num" style="color:var(--good)">${pass}</div><div class="label">ผ่าน</div></div>
    <div class="stat"><div class="num" style="color:var(--warn)">${improve}</div><div class="label">ควรปรับปรุง</div></div>
    <div class="stat"><div class="num" style="color:var(--danger)">${fail}</div><div class="label">ไม่ผ่าน</div></div>
  `;
}

function renderTable(rows) {
  const area = document.getElementById('tableArea');
  if (!rows.length) {
    area.innerHTML = '<div class="empty">ไม่พบข้อมูล</div>';
    return;
  }
  const formTypeLabel = { vet: 'สัตวแพทย์', staff: 'บุคลากรทั่วไป' };
  area.innerHTML = `<table>
    <thead><tr>
      <th>ชื่อ</th><th>ตำแหน่ง</th><th>ประเภท</th><th>รอบ</th><th>คะแนนรวม</th><th>ระดับ</th><th>ผลสรุป</th><th>วันที่ส่ง</th>
    </tr></thead>
    <tbody>
      ${rows.map((r, i) => `
        <tr class="row" onclick="toggleDetail(${i})">
          <td>${escapeHtml(r.evaluateeName)}</td>
          <td>${escapeHtml(r.position)}</td>
          <td>${formTypeLabel[r.formType] || r.formType}</td>
          <td>ครั้งที่ ${r.round}</td>
          <td class="score-cell">${r.totalScore} / 100</td>
          <td>${escapeHtml(r.level)}</td>
          <td><span class="badge ${decisionClass(r.decision)}">${decisionLabel(r.decision)}</span></td>
          <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString('th-TH') : '-'}</td>
        </tr>
        <tr class="detail-row" id="detail-${i}" style="display:none;"><td colspan="8">${renderDetail(r)}</td></tr>
      `).join('')}
    </tbody>
  </table>`;
}

function renderDetail(r) {
  let personalItems = [], secondItems = [];
  try { personalItems = JSON.parse(r.personalItemsJson || '[]'); } catch (e) {}
  try { secondItems = JSON.parse(r.secondItemsJson || '[]'); } catch (e) {}
  return `<div class="detail-grid">
    <div>
      <h4>พฤติกรรมส่วนบุคคล (${r.personalTotal})</h4>
      <ul>${personalItems.map(it => `<li>${escapeHtml(it.name)}: ${it.score}/${it.max}</li>`).join('')}</ul>
    </div>
    <div>
      <h4>ส่วนที่สอง (${r.secondTotal})</h4>
      <ul>${secondItems.map(it => `<li>${escapeHtml(it.name)}: ${it.score}/${it.max}</li>`).join('')}</ul>
    </div>
    <div style="grid-column:1/-1;">
      <h4>ผู้ประเมิน / หมายเหตุ</h4>
      <div>ผู้ประเมิน: ${escapeHtml(r.evaluatorName)}</div>
      ${r.decisionReason ? `<div>รายละเอียด: ${escapeHtml(r.decisionReason)}</div>` : ''}
      ${r.decisionEffectiveDate ? `<div>มีผลตั้งแต่: ${escapeHtml(r.decisionEffectiveDate)}</div>` : ''}
      ${r.suggestion ? `<div>ข้อเสนอแนะ: ${escapeHtml(r.suggestion)}</div>` : ''}
    </div>
  </div>`;
}

function toggleDetail(i) {
  const el = document.getElementById(`detail-${i}`);
  el.style.display = el.style.display === 'none' ? 'table-row' : 'none';
}

function applyFilters() {
  const name = document.getElementById('searchName').value.trim().toLowerCase();
  const type = document.getElementById('filterType').value;
  const decision = document.getElementById('filterDecision').value;
  const filtered = allEvals.filter(r => {
    if (name && !r.evaluateeName.toLowerCase().includes(name)) return false;
    if (type && r.formType !== type) return false;
    if (decision && r.decision !== decision) return false;
    return true;
  });
  renderTable(filtered);
}

['searchName', 'filterType', 'filterDecision'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
});

async function load() {
  try {
    allEvals = await api('listEvaluations', {});
    renderStats(allEvals);
    renderTable(allEvals);
  } catch (err) {
    document.getElementById('tableArea').innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${escapeHtml(err.message)}</div>`;
  }
}

load();
</script>
</body>
</html>
