<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSU SSO / OpenID Connect Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 440px;
      border: 1px solid #e2e8f0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #1d4ed8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      color: #0f172a;
      margin: 0 0 8px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 16px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>ยืนยันตัวตน PSU SSO สำเร็จ</h2>
    <p>กำลังส่งต่อข้อมูลบัญชีผู้ใช้ และจะปิดหน้าต่างนี้โดยอัตโนมัติ...</p>
    <div class="badge">PSU Single Sign-On (OIDC)</div>
  </div>

  <script>
    try {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      if (window.opener) {
        window.opener.postMessage({
          type: 'OAUTH_AUTH_SUCCESS',
          provider: 'psu_sso',
          code: code,
          state: state,
          error: error
        }, '*');
        setTimeout(() => {
          window.close();
        }, 800);
      } else {
        setTimeout(() => {
          window.location.href = '/';
        }, 1200);
      }
    } catch (e) {
      console.error('Callback error:', e);
      if (window.opener) window.close();
    }
  </script>
</body>
</html>
